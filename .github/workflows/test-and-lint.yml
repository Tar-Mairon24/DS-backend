name: Backend Tests and Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Run Go tests
        run: go test -v -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/...,./middleware/... ./test/unit/...
      
      - name: Run Go linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
  
  trigger-e2e:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger E2E Tests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'mauroav21',
              repo: 'AutPruebLogin',
              workflow_id: 'e2e-login-tests.yml',
              ref: 'main'
            });