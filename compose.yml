services:
  backend:
    container_name: ds_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      DB_HOST: ds_database
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}

    networks:
      - ds-network
    restart: unless-stopped
    depends_on:
      - ds_database
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT}/api/v1/health"]
      interval: 1800s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: ds_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${USER_PASSWORD}
      MYSQL_HOST: ${DB_HOST}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./:/docker-entrypoint-initdb.d
    networks:
      - ds-network

networks:
  ds-network:
    external: true
